#User Configuration

#OE_TERMINAL = "tmux"

KERNEL_DTB = "zynqmp-zcu102-rev10-ad9361-fmcomms2-3"

# P501 wires its debug console to PS UART1, not UART0 (see system-user.dtsi chosen
# override: console=ttyPS1). meta-xilinx-core's zynqmp-generic.conf hardcodes
# SERIAL_CONSOLES = "115200;ttyPS0" for all ZynqMP boards generically, which only
# statically enables serial-getty@ttyPS0.service in the rootfs -- a UART we don't
# even have enabled. Override to match our real console so a getty is guaranteed
# to be listening on the right port.
SERIAL_CONSOLES = "115200;ttyPS1"

# Force a known root password: the layer's built-in default shadow hash doesn't
# correspond to "root", "petalinux", or empty -- whatever it actually is isn't
# documented anywhere in this project, so set a known one explicitly instead of
# guessing. Standard Yocto extrausers mechanism, hashes "root" at build time.
# ("inherit" only works in .bb/.bbclass files; IMAGE_CLASSES is the .conf-file
# equivalent for applying a class to image recipes.)
IMAGE_CLASSES += "extrausers"
EXTRA_USERS_PARAMS = "usermod -P root root;"

# iiod (the IIO network/USB daemon) for PlutoSDR-style libiio access. The meta-adi
# bbappend's libiio recipe auto-builds iiod with USB FunctionFS gadget support
# (WITH_IIOD_USBD, gated only on WITH_AIO which needs libaio -- already a hard
# DEPENDS of the recipe) as well as the normal network backend, with no extra
# PACKAGECONFIG needed. iio_info/iio_attr/etc are already present (libiio-tests,
# pulled in separately) -- this only adds the missing daemon + its systemd unit.
IMAGE_INSTALL:append = " libiio-iiod usb-gadget-iio"
